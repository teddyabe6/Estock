# Local development stack (PRD 18).
#
#   docker compose up --build        start everything
#   docker compose exec api pytest   run the tests against PostgreSQL
#
# The API applies migrations on start. Set SEED_ON_START=true to load the demo
# business described in backend/app/seed.py.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: estock
      POSTGRES_PASSWORD: estock
      POSTGRES_DB: estock
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estock -d estock"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    entrypoint: ["/app/entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DATABASE_URL: postgresql+psycopg://estock:estock@db:5432/estock
      REDIS_URL: redis://redis:6379/0
      # Development only. Generate a real secret for any deployment.
      SECRET_KEY: ${SECRET_KEY:-development-only-secret-change-me}
      ENVIRONMENT: development
      DEBUG: "true"
      PUBLIC_BASE_URL: http://localhost:3000
      STORAGE_LOCAL_ROOT: /app/var/uploads
      SEED_ON_START: ${SEED_ON_START:-false}
    volumes:
      - ./backend:/app
      - uploads:/app/var/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "-m", "app.workers.scheduler", "--loop", "--interval", "3600"]
    environment:
      DATABASE_URL: postgresql+psycopg://estock:estock@db:5432/estock
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-development-only-secret-change-me}
      STORAGE_LOCAL_ROOT: /app/var/uploads
    volumes:
      - ./backend:/app
      - uploads:/app/var/uploads
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build: ./web
    command: ["npm", "run", "dev"]
    environment:
      # The browser calls the API directly, so this is the host-visible URL.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db_data:
  uploads:
  web_node_modules:
