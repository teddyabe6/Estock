name: estock_mobile
description: Estock — shop management, sales, stock and credit on your phone.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # HTTP client; the API is the single source of business rules.
  http: ^1.2.2
  # Local persistence for the session token and the offline outbox.
  shared_preferences: ^2.3.3
  # Tells the app when the device is back online so the outbox can drain.
  connectivity_plus: ^6.1.0
  # ETB and date formatting.
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Fonts are bundled, not fetched from a CDN. Two reasons, both about this
  # product: shops work on intermittent connections, and Amharic needs Ethiopic
  # glyphs that a Latin-only default font does not carry (PRD 16).
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
        - asset: assets/fonts/NotoSansEthiopic-Bold.ttf
          weight: 700
