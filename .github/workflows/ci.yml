name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, tests on PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: estock
          POSTGRES_PASSWORD: estock
          POSTGRES_DB: estock_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U estock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://estock:estock@localhost:5432/estock_test
      TEST_DATABASE_URL: postgresql+psycopg://estock:estock@localhost:5432/estock_test
      SECRET_KEY: ci-only-secret-not-used-anywhere-else

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check migrations still match the models
        run: alembic check

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing

  backend-sqlite:
    name: Backend (SQLite fast path)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite://"
      SECRET_KEY: ci-only-secret-not-used-anywhere-else
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1

  mobile:
    name: Mobile (analyze, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # A web build is the cheapest proof the app still compiles; --no-web-resources-cdn
      # keeps CanvasKit local, which is also how it ships.
      - run: flutter build web --release --no-web-resources-cdn
        env:
          FLUTTER_API_BASE_URL: http://localhost:8000/api/v1

  session-hook:
    name: SessionStart hook (syntax and guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n .claude/hooks/session-start.sh
      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning .claude/hooks/session-start.sh
      # The hook must do nothing outside Claude Code on the web; local machines
      # use `make setup`. Unset the variable explicitly so the check does not
      # depend on whatever the runner happens to have.
      - name: Does nothing locally
        run: |
          output=$(env -u CLAUDE_CODE_REMOTE CLAUDE_PROJECT_DIR="$PWD" ./.claude/hooks/session-start.sh)
          test -z "$output" || { echo "hook ran outside a remote session: $output"; exit 1; }
      - name: Settings register the hook
        run: |
          python3 -c "
          import json, sys
          cfg = json.load(open('.claude/settings.json'))
          hooks = cfg['hooks']['SessionStart'][0]['hooks']
          assert any('session-start.sh' in h['command'] for h in hooks), hooks
          print('hook is registered')
          "
      - name: Makefile targets resolve
        run: make -n help setup test lint >/dev/null && echo "make targets OK"
